AWSTemplateFormatVersion: '2010-09-09'
Description: Amazon Elastic Block Store - Single Linux Instance
Parameters:
  KeyName:
    Description: Name of an existing EC2 KeyPair
    Type: String

  InstanceType:
    Default: t3.micro
    Description: EC2 instance type, e.g. m1.small, m1.large, etc.
    Type: String

  AmazonLinuxAMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    # Replacing AMZN 1 to 2
    #Default: /aws/service/ami-amazon-linux-latest/amzn-ami-hvm-x86_64-gp2
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  VPCCIDR:
    Description: CIDR Block for VPC
    Type: String
    Default: 10.1.0.0/16
    AllowedValues:
      - 10.1.0.0/16

  PublicSubnet1Param:
    Description: Public Subnet 1
    Type: String
    Default: 10.1.11.0/24
    AllowedValues:
      - 10.1.11.0/24

  PublicSubnet2Param:
    Description: Public Subnet 2
    Type: String
    Default: 10.1.12.0/24
    AllowedValues:
      - 10.1.12.0/24

  PrivateSubnet1Param:
    Description: Private Subnet 1
    Type: String
    Default: 10.1.101.0/24
    AllowedValues:
      - 10.1.101.0/24

  PrivateSubnet2Param:
    Description: Private Subnet 2
    Type: String
    Default: 10.1.102.0/24
    AllowedValues:
      - 10.1.102.0/24

  AdministratorPassword:
    Type: String
    Description: >-
      Randomly generated password Vocareum will set which can then be re-used for
      other resources
    Default: Default-Admin-Password123

  AdministratorUser:
    Type: String
    Description: >-
      The Administrator username which is associated with the previous Parameter
      - AdministratorPassword
    Default: Default-Admin-User

  AWSAccessKey:
    Type: String
    Description: >-
      Automatically created Access Key, associated to the IAM student account,
      which can then be re-used for other resources
    Default: Default-IAM-AWSAccessKey
  AWSSecretAccessKey:
    Type: String
    Description: >-
      Automatically created SecretAccess Key, associated to the IAM student
      account, which can then be re-used for other resources
    Default: Default-IAM-AWSSecretAccessKey

Resources:

  Ec2Instance:
    Type: AWS::EC2::Instance
    DependsOn: Ec2SecurityGroup
    Properties:
      Tags:
        - Key: Name
          Value: Lab
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      ImageId: !Ref 'AmazonLinuxAMIID'
      InstanceType: !Ref 'InstanceType'
      KeyName: !Ref 'KeyName'
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref Ec2SecurityGroup

  Ec2SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      VpcId:
        Ref: VPC
      GroupDescription: SSH access on port 80 and 22
      SecurityGroupIngress:
        - CidrIp: 0.0.0.0/0
          FromPort: '22'
          IpProtocol: tcp
          ToPort: '22'
        - CidrIp: 0.0.0.0/0
          FromPort: '80'
          IpProtocol: tcp
          ToPort: '80'

  VPC:
   Type: 'AWS::EC2::VPC'
   Properties:
    CidrBlock: !Ref VPCCIDR
    EnableDnsSupport: 'true'
    EnableDnsHostnames: 'true'
    Tags:
    - Key: Name
      Value: Lab VPC

  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    DependsOn: VPC

  AttachGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    DependsOn:
      - VPC
      - InternetGateway
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  PublicSubnet1:
    Type: 'AWS::EC2::Subnet'
    DependsOn: AttachGateway
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Param
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Public Subnet 1

  PublicSubnet2:
    Type: 'AWS::EC2::Subnet'
    DependsOn: AttachGateway
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Param
      AvailabilityZone: !Select
        - '1'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Public Subnet 2

  PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    DependsOn:
      - VPC
      - AttachGateway
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Public

  PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn:
      - PublicRouteTable
      - AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  PublicSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    DependsOn:
      - PublicRouteTable
      - PublicSubnet1
      - AttachGateway
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    DependsOn:
      - PublicRouteTable
      - PublicSubnet2
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

#  userAccessKey:
#    Type: AWS::IAM::AccessKey
#    Properties:
#      UserName: 'awsstudent' 
#
Outputs:
  PublicIP:
    Description: DNS Name of the newly created EC2 instance
    Value: !GetAtt 'Ec2Instance.PublicIp'
  AvailabilityZone:
    Value: !Select
      - '0'
      - !GetAZs ''
