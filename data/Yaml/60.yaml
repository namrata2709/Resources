AWSTemplateFormatVersion: 2010-09-09
Description: Managing Storage on AWS (Linux)
Parameters:
  VPCCIDR:
    Description: CIDR Block for VPC
    Type: String
    Default: 10.5.0.0/16
    AllowedValues:
      - 10.5.0.0/16
  PublicSubnet1Param:
    Description: Public Subnet 1
    Type: String
    Default: 10.5.0.0/24
    AllowedValues:
      - 10.5.0.0/24
  KeyName:
    Type: String
    Description: Keyname for the keypair that Vocareum will use to launch EC2 instances.
    Default: default-lab-key
  LinuxAmiId:
    Description: The name of the Windows AMI to find based on search
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
Resources:
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref VPCCIDR
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
        - Key: VPC
          Value: NAT-and-CLI
        - Key: Name
          Value: Lab VPC
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    DependsOn: VPC
  AttachGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    DependsOn:
      - VPC
      - InternetGateway
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet1:
    Type: 'AWS::EC2::Subnet'
    DependsOn: AttachGateway
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Param
      MapPublicIpOnLaunch: 'true'
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Public Subnet 1
  PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    DependsOn:
      - VPC
      - AttachGateway
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Public
  PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn:
      - PublicRouteTable
      - AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    DependsOn:
      - PublicRouteTable
      - PublicSubnet1
      - AttachGateway
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  SSHAccess:
    Type: 'AWS::EC2::SecurityGroup'
    DependsOn: AttachGateway
    Properties:
      GroupDescription: Access via SSH
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: SSH Access
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
  CommandHostInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - S3BucketAccess
      - PublicSubnet1
      - SSHAccess
      - AttachGateway
    Properties:
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref S3BucketAccess
      ImageId: !Ref LinuxAmiId
      InstanceType: t3.medium
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref SSHAccess
      Tags:
        - Key: Name
          Value: Command Host
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -ex
          yum -y update
          mkdir /home/ec2-user/.aws
          chown -R ec2-user:ec2-user /home/ec2-user/.aws
          cat > /home/ec2-user/.aws/config <<EOF
          [default]
          region=${AWS::Region}
          EOF
          cd /home/ec2-user
          yum -y install php
          cd /home/ec2-user
          #wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/183-lab-JAWS-managing-storage/s3/snapshotter_v2.py ###commenting this out for now as this script is still having trouble launching - below is hardcoded line that works###
          #wget https://aws-tc-largeobjects.s3-us-west-2.amazonaws.com/ILT-TF-200-ACSOPS-1/lab-5-storage-linux/snapshotter_v2.py
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-1-23732/183-lab-JAWS-managing-storage/s3/snapshotter_v2.py
          chmod 740 ./snapshotter_v2.py
          chown ec2-user snapshotter_v2.py
          curl -O https://bootstrap.pypa.io/pip/3.8/get-pip.py        
          #yum -y install python37
          amazon-linux-extras install python3.8
          python3.8 get-pip.py
          export PATH=$PATH:~/.local/bin
          pip3 install boto3
          pip3 install awscli --upgrade
          # Signal the status from cfn-init
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource CommandHostInstance --region ${AWS::Region}
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: "PT10M"
  ProcessorHostInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - S3BucketAccess
      - PublicSubnet1
      - SSHAccess
      - AttachGateway
    Properties:
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref S3BucketAccess
      ImageId: !Ref LinuxAmiId
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref SSHAccess
      Tags:
        - Key: Name
          Value: Processor
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash -ex
          yum -y update
          mkdir /home/ec2-user/.aws
          cat > /home/ec2-user/.aws/config <<EOF
          [default]
          region=${AWS::Region}
          EOF
          chown -R ec2-user:ec2-user /home/ec2-user/.aws
          curl -O https://bootstrap.pypa.io/pip/3.8/get-pip.py        
          #yum -y install python37
          amazon-linux-extras install python3.8
          python3.8 get-pip.py
          export PATH=$PATH:~/.local/bin
          pip3 install boto3
          pip3 install awscli --upgrade
          # Signal the status from cfn-init
          /opt/aws/bin/cfn-signal -e $? --stack ${AWS::StackName} --resource ProcessorHostInstance --region ${AWS::Region}
    CreationPolicy:
      ResourceSignal:
        Count: 1
        Timeout: "PT10M"
  S3BucketAccessRole:
    Type: 'AWS::IAM::Role'
    Properties:
      RoleName: S3BucketAccessRole
      Path: /
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowAllActions
                Action:
                  - 's3:*'
                  - "ec2:*Address*"
                  - "ec2:*Bundle*"
                  - "ec2:*Cidr*"
                  - "ec2:*Dhcp*"
                  - "ec2:*Encryption*"
                  - "ec2:*Event*"
                  - "ec2:*Gateway*"
                  - "ec2:*IdFormat"
                  - "ec2:*Image*"
                  - "ec2:*KeyPair"
                  - "ec2:*Kms*"
                  - "ec2:*Log*"
                  - "ec2:*Managed*"
                  - "ec2:*Network*"
                  - "ec2:*Route*"
                  - "ec2:*SecurityGroup*"
                  - "ec2:*SnapshotAttribute"
                  - "ec2:*Subnet*"
                  - "ec2:*Tag*"
                  - "ec2:*Task"
                  - "ec2:*Traffic*"
                  - "ec2:*Vpc*"
                  - "ec2:*Vpn*"
                  - "ec2:Accept*"
                  - "ec2:AllocateHosts"
                  - "ec2:Associate*"
                  - "ec2:AttachVolume"
                  - "ec2:Cancel*"
                  - "ec2:Confirm*"
                  - "ec2:CopySnapshot"
                  - "ec2:CreateSnapshot*"
                  - "ec2:Delete*"
                  - "ec2:Describe*"
                  - "ec2:DetachVolume"
                  - "ec2:Disable*"
                  - "ec2:Disassociate*"
                  - "ec2:Export*"
                  - "ec2:Get*"
                  - "ec2:ModifyAvailabilityZoneGroup"
                  - "ec2:ModifyInstanceMetadataOptions"
                  - "ec2:MonitorInstances"
                  - "ec2:ReleaseHosts"
                  - "ec2:ReplaceIamInstanceProfileAssociation"
                  - "ec2:ReportInstanceStatus"
                  - "ec2:SendDiagnosticInterrupt"
                  - "ec2:StopInstances"
                  - "ec2:TerminateInstances"
                  - "ec2:UnmonitorInstances"
                Effect: Allow
                Resource: '*'
              - Sid: RestrictInstanceActions
                Action:
                  - "ec2:StartInstances"
                Condition:
                  StringEqualsIfExists:
                    "ec2:Owner": "amazon"
                  StringLikeIfExists:
                    'ec2:InstanceType':
                      -'t*.nano'
                      -"t*.micro"
                      -"t*.small"
                      -"t*.medium"
                  StringLikeIfExists:
                    'ec2:Tenancy': default
                  StringNotEqualsIfExists:
                    "ec2:PlacementGroupStrategy": "cluster"
                  StringNotLikeIfExists:
                    "ec2:VolumeType":
                      -"io*"
                      -"st*"
                  NumericLessThanEqualsIfExists:
                    "ec2:VolumeSize": "100"
                Effect: Allow
                Resource: '*'
              - Sid: DenyAllActions
                Action:
                  - 's3:*ObjectLegalHold'
                  - 's3:*ObjectRetention'
                  - 's3:*BucketObjectLock*'
                Effect: Deny
                Resource: '*'
          PolicyName: inlinepolicy
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
  S3BucketAccess:
    Type: 'AWS::IAM::InstanceProfile'
    DependsOn: S3BucketAccessRole
    Properties:
      InstanceProfileName: S3BucketAccess
      Path: /
      Roles:
        - !Ref S3BucketAccessRole
  IAMUser:
    Type: 'AWS::IAM::User'
    Properties:
      UserName: awsstudent
  IAMPolicy:
    Type: AWS::IAM::ManagedPolicy
    DependsOn: IAMUser
    Properties:
      PolicyDocument: {
                  "Version": "2012-10-17",
                  "Statement": [{
                      "Sid": "AllowAllActions",
                      "Action": [
                        "ec2:*Address*",
                        "ec2:*Bundle*",
                        "ec2:*Cidr*",
                        "ec2:*Dhcp*",
                        "ec2:*Encryption*",
                        "ec2:*Event*",
                        "ec2:*Gateway*",
                        "ec2:*IdFormat",
                        "ec2:*Image*",
                        "ec2:*KeyPair",
                        "ec2:*Kms*",
                        "ec2:*Log*",
                        "ec2:*Managed*",
                        "ec2:*Network*",
                        "ec2:*Route*",
                        "ec2:*SecurityGroup*",
                        "ec2:*SnapshotAttribute",
                        "ec2:*Subnet*",
                        "ec2:*Tag*",
                        "ec2:*Task",
                        "ec2:*Traffic*",
                        "ec2:*Vpc*",
                        "ec2:*Vpn*",
                        "ec2:Accept*",
                        "ec2:AllocateHosts",
                        "ec2:Associate*",
                        "ec2:AttachVolume",
                        "ec2:Cancel*",
                        "ec2:Confirm*",
                        "ec2:CopySnapshot",
                        "ec2:CreateSnapshot*",
                        "ec2:Delete*",
                        "ec2:Describe*",
                        "ec2:DetachVolume",
                        "ec2:Disable*",
                        "ec2:Disassociate*",
                        "ec2:Export*",
                        "ec2:Get*",
                        "ec2:ModifyAvailabilityZoneGroup",
                        "ec2:ModifyInstanceMetadataOptions",
                        "ec2:MonitorInstances",
                        "ec2:ReleaseHosts",
                        "ec2:ReplaceIamInstanceProfileAssociation",
                        "ec2:ReportInstanceStatus",
                        "ec2:SendDiagnosticInterrupt",
                        "ec2:StopInstances",
                        "ec2:TerminateInstances",
                        "ec2:UnmonitorInstances",
                        "s3:*"
                      ],
                      "Effect": "Allow",
                      "Resource": "*"
                    },
                        {
                            "Sid": "ServiceLinkedRoleAndPolicies",
                            "Effect": "Allow",
                            "Action": [
                                "iam:PassRole"
                            ],
                            "Resource": "arn:aws:iam::*:role/*S3BucketAccessRole*",
                            "Condition": {
                                "StringLikeIfExists": {
                                    "iam:PassedToService": [
                                        "ec2.amazonaws.com"
                                    ]
                                }
                            }
                        },
                    {
                      "Sid": "DenyAllActions",
                      "Action": [
                        "s3:*ObjectLegalHold",
                        "s3:*ObjectRetention",
                        "s3:*BucketObjectLock*"
                      ],
                      "Effect": "Deny",
                      "Resource": "*"
                    },
                    {
                      "Sid": "RestrictInstanceActions",
                      "Effect": "Allow",
                      "Action": [
                        "ec2:CreateFleet",
                        "ec2:CreateLaunchTemplate",
                        "ec2:CreateLaunchTemplateVersion",
                        "ec2:CreateVolume",
                        "ec2:EnableVolumeIO",
                        "ec2:ImportInstance",
                        "ec2:ImportSnapshot",
                        "ec2:ImportVolume",
                        "ec2:ModifyFleet",
                        "ec2:ModifyInstanceAttribute",
                        "ec2:ModifyInstanceCreditSpecification",
                        "ec2:ModifyLaunchTemplate",
                        "ec2:ModifyVolume",
                        "ec2:ModifyVolumeAttribute",
                        "ec2:RebootInstances",
                        "ec2:ResetInstanceAttribute",
                        "ec2:RunInstances",
                        "ec2:StartInstances"
                      ],
                      "Resource": "*",
                      "Condition": {
                        "StringEqualsIfExists": {
                          "ec2:Owner": "amazon"
                        },
                        "StringLikeIfExists": {
                          "ec2:InstanceType": [
                            "t*.nano",
                            "t*.micro",
                            "t*.small",
                            "t*.medium"
                          ],
                          "ec2:Tenancy": "default"
                        },
                        "StringNotEqualsIfExists": {
                          "ec2:PlacementGroupStrategy": "cluster"
                        },
                        "StringNotLikeIfExists": {
                          "ec2:VolumeType": [
                            "io*",
                            "st*"
                          ]
                        },
                        "NumericLessThanEqualsIfExists": {
                          "ec2:VolumeSize": "100"
                        }
                      }
                    },
                    {
                      "Sid": "RestrictActions",
                      "Effect": "Deny",
                      "Action": [
                        "ec2:*Fpga*",
                        "ec2:*Purchase*",
                        "ec2:*ReservedInstances*",
                        "ec2:*Scheduled*",
                        "ec2:*Spot*",
                        "ec2:AcceptVpcEndpointConnections",
                        "ec2:AttachVpnGateway",
                        "ec2:CreateCapacityReservation",
                        "ec2:CreateVpnGateway",
                        "ec2:EnableFastSnapshotRestores"
                      ],
                      "Resource": "*"
                    }
                  ]
                }
      ManagedPolicyName: lab_policy
      Users:
        - awsstudent
  IAMUserAccessKey:
    Type: 'AWS::IAM::AccessKey'
    DependsOn: IAMUser
    Properties:
      Status: Active
      UserName: awsstudent



