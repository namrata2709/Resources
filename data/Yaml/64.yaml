AWSTemplateFormatVersion: 2010-09-09
Description: CloudTrail activity template

Parameters:

  AmazonLinuxAMIID:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  KeyName:
    Type: String
    Description: Keyname for the keypair that Vocareum will use
    Default: lab-key-pair

Resources:

###########
# VPC with Internet Gateway
###########

  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: Lab VPC

  IGW:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: Lab IGW

  VPCtoIGWConnection:
    Type: AWS::EC2::VPCGatewayAttachment
    DependsOn:
      - IGW
      - VPC
    Properties:
      InternetGatewayId: !Ref IGW
      VpcId: !Ref VPC

###########
# Public Route Table
###########

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Public Route Table

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - PublicRouteTable
      - IGW
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW
      RouteTableId: !Ref PublicRouteTable

###########
# Public Subnet
###########

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      MapPublicIpOnLaunch: true
      CidrBlock: 10.0.0.0/24
      AvailabilityZone: !Select
        - 0
        - !GetAZs
          Ref: AWS::Region
      Tags:
        - Key: Name
          Value: Public Subnet

  PublicRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn:
      - PublicRouteTable
      - PublicSubnet1
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

###########
# Read only access for awsstudent (across services)
###########

  ReadOnlyGroup:
      Type: AWS::IAM::Group
      Properties:
        GroupName: QLReadOnly
        ManagedPolicyArns: [ "arn:aws:iam::aws:policy/ReadOnlyAccess" ]

  GroupAssignment:
    Type: AWS::IAM::UserToGroupAddition
    DependsOn: ReadOnlyGroup
    Properties:
      GroupName: QLReadOnly
      Users:
        - awsstudent

###########
# Cafe web server instance in public subnet
###########

  WebInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - VPC
      - WebServerSecurityGroup
      - PublicSubnet1
    Properties:
      ImageId: !Ref AmazonLinuxAMIID
      KeyName: !Ref KeyName
      InstanceType: t3.micro
      IamInstanceProfile: !Ref CafeInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref WebServerSecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: Cafe Web Server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum -y update
          #LAMP and web app install/config
          amazon-linux-extras install -y lamp-mariadb10.2-php7.2 php7.2
          yum -y install httpd mariadb-server wget expect
          systemctl enable httpd
          systemctl start httpd
          systemctl enable mariadb
          systemctl start mariadb
          echo '<html><h1>Hello From Your Web Server!</h1></html>' > /var/www/html/index.html
          find /var/www -type d -exec chmod 2775 {} \;
          find /var/www -type f -exec chmod 0664 {} \;
          echo "<?php phpinfo(); ?>" > /var/www/html/phpinfo.php
          usermod -a -G apache ec2-user
          chown -R ec2-user:apache /var/www
          chmod 2775 /var/www
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/187-activity-JAWS-cloudtrail/s3/setup-v2.tar.gz
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/187-activity-JAWS-cloudtrail/s3/db-v2.tar.gz
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/187-activity-JAWS-cloudtrail/s3/cafe-v2.tar.gz
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/187-activity-JAWS-cloudtrail/s3/monkey.jpg
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/187-activity-JAWS-cloudtrail/s3/hackeruserdata.txt
          mv hackeruserdata.txt /tmp/hackeruserdata.txt
          mv monkey.jpg /tmp/monkey.jpg
          tar -zxvf setup-v2.tar.gz
          tar -zxvf db-v2.tar.gz
          tar -zxvf cafe-v2.tar.gz -C /var/www/html/
          cd setup
          ./set-app-parameters.sh
          cd ../db/
          ./set-root-password.sh
          ./create-db.sh
          #AWS CLI config
          sleep 10
          ACCESS_KEY=${AwsStudentAccessKey}
          SECRET_KEY=${AwsStudentAccessKey.SecretAccessKey}
          usedRegion=$(curl http://169.254.169.254/latest/dynamic/instance-identity/document|grep region | cut -d '"' -f4)
          expect -c "set timeout -1
          spawn aws configure
          expect -re \"AWS Access *\"
          send \"$ACCESS_KEY\r\"
          expect -re \"AWS Secret *\"
          send \"$SECRET_KEY\r\"
          expect -re \"Default region *\"
          send \"$usedRegion\r\"
          expect -re \"Default output *\"
          send \"json\r\"
          expect eof"
          #AWS CLI config for chaos AWS user
          sleep 5
          CHAOS_ACCESS_KEY=${ChaosAccessKey}
          CHAOS_SECRET_KEY=${ChaosAccessKey.SecretAccessKey}
          expect -c "set timeout -1
          spawn aws configure --profile chaos
          expect -re \"AWS Access *\"
          send \"$CHAOS_ACCESS_KEY\r\"
          expect -re \"AWS Secret *\"
          send \"$CHAOS_SECRET_KEY\r\"
          expect -re \"Default region *\"
          send \"$usedRegion\r\"
          expect -re \"Default output *\"
          send \"json\r\"
          expect eof"
          #create a chaos-user OS login
          sleep 5
          /usr/sbin/adduser chaos-user
          expect -c "set timeout -1
          spawn sudo passwd chaos-user
          expect -re \"New password*\"
          send \"PassWord2019\r\"
          expect -re \"Retype*\"
          send \"PassWord2019\r\"
          expect eof"
          #Enable password-based authentication for this instance
          sed -i 's/#PasswordAuthentication yes/PasswordAuthentication yes/' /etc/ssh/sshd_config
          sed -i 's/PasswordAuthentication no/#PasswordAuthentication no/' /etc/ssh/sshd_config
          sleep 2
          sudo service sshd restart
          #copy the AWS CLI config profiles and settings to the other two OS user areas
          cp -R /root/.aws /home/ec2-user/
          chown -R ec2-user:ec2-user /home/ec2-user/.aws
          cp -R /root/.aws /home/chaos-user/
          chown -R chaos-user:chaos-user /home/chaos-user/.aws
          #set the hostname to help students know which instance they are logged into
          hostnamectl set-hostname web-server
          #create bucket to hold the CloudTrail logs
          randNum=$(shuf -i 10000-99999 -n 1)
          echo $randNum
          bName="cafeimagefiles"$randNum
          echo "Bucket name is "$bName
          echo "Creating bucket..."
          if [[ "$usedRegion" != "us-east-1" ]]; then
            bucket=$(aws s3api create-bucket --bucket $bName --region $usedRegion --create-bucket-configuration LocationConstraint=$usedRegion)
          else
            bucket=$(aws s3api create-bucket --bucket $bName --region us-east-1)
          fi
          echo "Copying image to bucket..."
          aws s3 cp /tmp/monkey.jpg s3://$bName
          #create another instance
          amiId=$(aws ssm get-parameters --names /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2 --region us-west-2 | grep Value | cut -d '"' -f4)
          #hackerKey=$(aws ec2 describe-key-pairs | grep KeyName | cut -d '"' -f4)
          #aws ec2 create-key-pair --key-name chaoskey |cut -d '"' -f4 | sed s/'-----END RSA PRIVATE KEY-----'// > /tmp/chaoskey.pem
          aws ec2 create-key-pair --key-name chaoskp --query 'KeyMaterial' --output text > /tmp/chaoskp.pem
          sleep 2
          chmod 400 /tmp/chaoskp.pem
          ssh-keygen -y -f /tmp/chaoskp.pem > /tmp/chaoskp.pub
          sleep 2
          aws ec2 import-key-pair --key-name chaoskp --public-key-material file:///tmp/chaoskp.pub --region us-west-2
          sleep 2
          sed -i "s/REPLACE_CHAOS_ACCESS_KEY/$CHAOS_ACCESS_KEY/" /tmp/hackeruserdata.txt
          sleep 2
          sed -i "s|REPLACE_CHAOS_SECRET_KEY|$CHAOS_SECRET_KEY|" /tmp/hackeruserdata.txt
          sleep 2
          sed -i "s|REPLACE_REGION|$usedRegion|" /tmp/hackeruserdata.txt
          sleep 2
          hackerInstance=$(aws ec2 run-instances --image-id  $amiId --count 1 --instance-type t3.micro --key-name chaoskp --region us-west-2 --tag-specifications 'ResourceType=instance,Tags=[{Key=Name,Value=HackerInstance}]' --associate-public-ip-address --user-data file:///tmp/hackeruserdata.txt)
          #get the SG ID id of hacker instance and open port 22
          sgIdHacker=$(echo $hackerInstance | python -m json.tool | grep GroupId | sed -n 1p | cut -d '"' -f4)
          aws ec2 authorize-security-group-ingress --group-id $sgIdHacker --protocol tcp --port 22 --cidr 0.0.0.0/0 --region us-west-2
          #Wait until the CloudTrail is created by the student
          trailExists=""
          echo "trailExists="$trailExists
          echo "entering wait phase..."
          while [[ "$trailExists" == "" ]]; do sleep 10 ; trailExists=$(aws cloudtrail describe-trails --trail-name-list | grep -i monitor ) ; echo "trailExists="$trailExists ; done
          echo "Now up to no good..."
          #First create some distracting CloudTrail log entries
          x=1; while [ $x -le  15 ]; do aws ec2 describe-instances --region $usedRegion ; x=$(( $x + 1 )); done
          x=1; while [ $x -le  25 ]; do aws ec2 describe-security-groups --region $usedRegion ; x=$(( $x + 1 )); done
          x=1; while [ $x -le  25 ]; do aws ec2 create-security-group --description securitygroup$x --group-name securitygroup$x --region $usedRegion ; x=$(( $x + 1 )); done
          echo "Time is "$date
          #get the SG ID
          sgId=$(aws ec2 describe-instances --filters "Name=tag:Name,Values='Cafe Web Server'" --query 'Reservations[*].Instances[*].SecurityGroups[*].[GroupId]' --region $usedRegion --output text --profile chaos)
          echo "sgId="$sgId
          aws ec2 authorize-security-group-ingress --group-id $sgId --protocol tcp --port 22 --cidr 0.0.0.0/0 --region $usedRegion --profile chaos
          echo "Doing a getObject operation as chaos..."
          aws s3 cp s3://$bName/monkey.jpg /var/www/html/cafe/images/monkey.jpg --region $usedRegion --profile chaos
          mv /var/www/html/cafe/images/Coffee-and-Pastries.jpg /var/www/html/cafe/images/Coffee-and-Pastries.backup
          mv /var/www/html/cafe/images/monkey.jpg /var/www/html/cafe/images/Coffee-and-Pastries.jpg
          chown chaos-user:root /var/www/html/cafe/images/Coffee-and-Pastries.jpg
          chown chaos-user:root /var/www/html/cafe/images/Coffee-and-Pastries.backup

  IamPolicy:
      Type: 'AWS::IAM::Policy'
      Properties:
        PolicyName: FullSsmAccess
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - 'ssm:*'
              Resource: '*'
        Roles:
          - !Ref CafeIamRole

  CafeIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: Chaos
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'ec2:describe*'
                  - 'ec2:authorize*'
                  - 's3:*'
                  - 'ssm:*'
                Resource: '*'

  CafeInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    DependsOn:
      - CafeIamRole
    Properties:
      Path: /
      Roles:
        - !Ref CafeIamRole

###########
# Security Group for Web Server
###########

#intentionally does not have port 22 open

  WebServerSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: WebSecurityGroup
      GroupDescription: Enable HTTP and SSH ingress
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: Web Server Security Group

###########
# Users and keys
###########

#Additional user for this activity
  ChaosUser:
    Type: AWS::IAM::User
    Properties:
      UserName: chaos
      LoginProfile:
          Password : passW0rd1999
          PasswordResetRequired : false
      Policies:
        - PolicyName: ChaosPolicy
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'ec2:describe*'
                  - 'ec2:authorize*'
                  - 's3:*'
                  - 'ssm:*'
                Resource: '*'

#Key for additional user
  ChaosAccessKey:
    Type: AWS::IAM::AccessKey
    DependsOn:
      - ChaosUser
    Properties:
      Status: Active
      UserName: chaos

  IAMUser:
    Type: 'AWS::IAM::User'
    Properties:
      UserName: awsstudent

  IAMPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    DependsOn: IAMUser
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement: [{
            "Sid": "AllowAllActions",
            "Effect": "Allow",
            "Action": [
                "athena:*",
                "cloudformation:List*",
                "cloudformation:Describe*",
                "cloudformation:Detect*",
                "cloudformation:EstimateTemplateCost",
                "cloudformation:Get*",
                "cloudwatch:*",
                "cloudtrail:*",
                "ec2:*Address*",
                "ec2:*associate*",
                "ec2:AttachVolume",
                "ec2:BundleInstance",
                "ec2:Cancel*",
                "ec2:*Capacity*",
                "ec2:CreateInstanceExportTask",
                "ec2:CreateFlowLogs",
                "ec2:*Credit*",
                "ec2:*Cidr",
                "ec2:Delete*",
                "ec2:Describe*",
                "ec2:DetachVolume",
                "ec2:*Dhcp*",
                "ec2:*Ebs*",
                "ec2:*Event*",
                "ec2:*Fleet*",
                "ec2:*Format",
                "ec2:*Gateway*",
                "ec2:Get*",
                "ec2:*InstanceAttribute",
                "ec2:*InternetGateway",
                "ec2:*Image*",
                "ec2:*KeyPair",
                "ec2:*Kms*",
                "ec2:*monitor*",
                "ec2:*Network*",
                "ec2:*Options",
                "ec2:*PrefixList*",
                "ec2:ReportInstanceStatus",
                "ec2:RebootInstances",
                "ec2:ReplaceIamInstanceProfileAssociation",
                "ec2:*Route*",
                "ec2:*SecurityGroup*",
                "ec2:Search*",
                "ec2:SendDiagnosticInterrupt",
                "ec2:StopInstances",
                "ec2:*Snapshot*",
                "ec2:*Subnet*",
                "ec2:*Tag*",
                "ec2:TerminateInstances",
                "ec2:*Traffic*",
                "ec2:*Vpn*",
                "ec2:*Vpc*",
                "events:*",
                "glue:*",
                "iam:DeleteLoginProfile",
                "iam:DeleteUserPolicy",
                "iam:DeleteAccessKey",
                "iam:List*",
                "iam:Get*",
                "kms:List*",
                "kms:Describe*",
                "logs:*",
                "resource-groups:Get*",
                "resource-groups:List*",
                "resource-groups:SearchResources",
                "s3:*",
                "ssm:List*",
                "ssm:Describe*",
                "ssm:Get*",
                "ssm:PutInventory",
                "ssm:PutComplianceItems",
                "ssm:PutConfigurePackageResult",
                "ssm:UpdateAssociationStatus",
                "ssm:UpdateInstanceAssociationStatus",
                "ssm:UpdateInstanceInformation",
                "ssm:CancelCommand",
                "ssm:SendCommand",
                "ssm:StartAutomationExecution",
                "ssm:StartSession",
                "ssm:TerminateSession",
                "ssm:ResumeSession",
                "ssm:DescribeSessions",
                "ssm:GetConnectionStatus",
                "sns:CreateTopic",
                "sns:DeleteTopic",
                "sns:AddPermission",
                "sns:RemovePermission",
                "sns:Publish",
                "sns:Subscribe",
                "sns:Unsubscribe",
                "sns:ConfirmSubscription",
                "sns:Get*",
                "sns:Set*",
                "sns:List*",
                "tag:*"
            ],
            "Resource": "*"
        },
        {
            "Sid": "RestrictInstanceActions",
            "Effect": "Allow",
            "Action": [
                "ec2:CreateVolume",
                "ec2:EnableVolumeIO",
                "ec2:ImportVolume",
                "ec2:ImportSnapshot",
                "ec2:ImportInstance",
                "ec2:*LaunchTemplate*",
                "ec2:ModifyVolume*",
                "ec2:RunInstances",
                "ec2:StartInstances"
            ],
            "Resource": "*",
            "Condition": {
                "StringEqualsIfExists": {
                    "ec2:Owner": "amazon"
                },
                "ForAllValues:StringLikeIfExists": {
                    "ec2:InstanceType": [
                        "*.nano",
                        "*.micro",
                        "*.small"
                    ],
                    "ec2:Tenancy": "default"
                },
                "StringNotEqualsIfExists": {
                    "ec2:PlacementGroupStrategy": "cluster"
                },
                "StringNotEqualsIgnoreCaseIfExists": {
                    "ec2:VolumeType": [
                        "io1",
                        "st1"
                    ]
                },
                "NumericLessThanEqualsIfExists": {
                    "ec2:VolumeSize": "101"
                }
            }
        },
        {
            "Sid": "RestrictActions",
            "Effect": "Deny",
            "Action": [
                "ec2:*Fpga*",
                "ec2:*Purchase*",
                "ec2:*ReservedInstances*",
                "ec2:*Scheduled*",
                "ec2:*Spot*",
                "ec2:AcceptVpcEndpointConnections",
                "ec2:AttachVpnGateway",
                "ec2:CreateCapacityReservation",
                "ec2:CreateVpnGateway",
                "ec2:EnableFastSnapshotRestores"
            ],
            "Resource": "*"
        }]
      ManagedPolicyName: lab_policy
      Users:
        - awsstudent

  IAMUserAccessKey:
    Type: 'AWS::IAM::AccessKey'
    DependsOn: IAMUser
    Properties:
      Status: Active
      UserName: awsstudent

  AwsStudentAccessKey:
    Type: AWS::IAM::AccessKey
    DependsOn: IAMUser
    Properties:
      Status: Active
      UserName: awsstudent

Outputs:

  WebServerIP:
    Description: Outputs to be used by activity environment
    Value: !Sub ${WebInstance.PublicIp}

  WebSecurityGroup:
    Value: !Sub ${WebServerSecurityGroup}
    Description: Web Security Group

  LabRegion:
    Value: !Ref 'AWS::Region'

  AccessKey:
    Value: !Ref IAMUserAccessKey
  
  SecretKey:
    Value: !GetAtt 
      - IAMUserAccessKey
      - SecretAccessKey
