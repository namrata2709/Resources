AWSTemplateFormatVersion: 2010-09-09
Description: reStart Activity troubleshooting a VPC

Parameters:

  VPCCIDR:
    Description: CIDR Block for VPC1
    Type: String
    Default: 10.0.0.0/16
    AllowedValues:
      - 10.0.0.0/16

  KeyName:
    Type: String
    Description: Keyname for the keypair
    #Default: lab-key-pair
    
# Use public Systems Manager Parameter

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

Resources:

###########
# VPC with 1 public subnet and 1 private subnet
###########

  VPC1:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref VPCCIDR
      Tags:
        - Key: Name
          Value: VPC1

  VPC1InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    DependsOn: VPC1
    Properties:
      Tags:
        - Key: Name
          Value: VPC1 Internet Gateway

  VPC1AttachInternetGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    DependsOn:
      - VPC1
      - VPC1InternetGateway
    Properties:
      VpcId: !Ref VPC1
      InternetGatewayId: !Ref VPC1InternetGateway

  VPC1PublicSubnet1:
    Type: 'AWS::EC2::Subnet'
    DependsOn: VPC1
    Properties:
      VpcId: !Ref VPC1
      CidrBlock: 10.0.1.0/24
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: VPC1 Public Subnet 1

  VPC1PrivateSubnet1:
    Type: 'AWS::EC2::Subnet'
    DependsOn: VPC1
    Properties:
      VpcId: !Ref VPC1
      CidrBlock: 10.0.3.0/24
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: VPC1 Private Subnet 1

###########
# VPC1 Public Routing
###########

  VPC1PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    DependsOn:
      - VPC1
      - VPC1AttachInternetGateway
    Properties:
      VpcId: !Ref VPC1
      Tags:
        - Key: Name
          Value: VPC1 Public Route Table

  VPC1PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn:
      - VPC1
      - VPC1PublicRouteTable
      - VPC1InternetGateway
      - VPC1AttachInternetGateway
    Properties:
      RouteTableId: !Ref VPC1PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VPC1InternetGateway

  VPC1PublicSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    DependsOn:
      - VPC1PublicRouteTable
      - VPC1PublicSubnet1
    Properties:
      SubnetId: !Ref VPC1PublicSubnet1
      RouteTableId: !Ref VPC1PublicRouteTable

###########
# VPC1 Public NACL settings
###########

  VPC1PublicNetworkAcl:
    Type: AWS::EC2::NetworkAcl
    DependsOn: VPC1
    Properties:
      VpcId: !Ref VPC1
      Tags:
        - Key: Name
          Value: VPC1 Public Network ACL

  VPC1PublicNetworkAclEntry1:
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: VPC1PublicNetworkAcl
    Properties:
      NetworkAclId:
        Ref: VPC1PublicNetworkAcl
      RuleNumber: '40'
      Protocol: "6"
      RuleAction: deny
      Egress: 'false'
      CidrBlock: 0.0.0.0/0
      Icmp:
        Code: "-1"
        Type: "-1"
      PortRange:
        From: '22'
        To: '22'

  VPC1PublicNetworkAclEntry2:
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: VPC1PublicNetworkAcl
    Properties:
      NetworkAclId:
        Ref: VPC1PublicNetworkAcl
      RuleNumber: '100'
      Protocol: "-1"
      RuleAction: allow
      Egress: 'false'
      CidrBlock: 0.0.0.0/0
      Icmp:
        Code: "-1"
        Type: "-1"
      PortRange:
        From: '-1'
        To: '-1'

  VPC1PublicNetworkAclEntry3:
    Type: AWS::EC2::NetworkAclEntry
    DependsOn: VPC1PublicNetworkAcl
    Properties:
      NetworkAclId:
        Ref: VPC1PublicNetworkAcl
      RuleNumber: '100'
      Protocol: "-1"
      RuleAction: allow
      Egress: 'true'
      CidrBlock: 0.0.0.0/0
      Icmp:
        Code: "-1"
        Type: "-1"
      PortRange:
        From: '-1'
        To: '-1'

  VPC1PublicNetworkAclAssociation:
    Type: AWS::EC2::SubnetNetworkAclAssociation
    DependsOn:
      - VPC1PublicSubnet1
      - VPC1PublicNetworkAcl
    Properties:
      SubnetId: !Ref VPC1PublicSubnet1
      NetworkAclId: !Ref VPC1PublicNetworkAcl

###########
# VPC1 Private Routing and NACL
###########

  VPC1PrivateRouteTable:
    Type: 'AWS::EC2::RouteTable'
    DependsOn: VPC1
    Properties:
      VpcId: !Ref VPC1
      Tags:
        - Key: Name
          Value: VPC1 Private Route Table

  VPC1PrivateRoute:
    Type: 'AWS::EC2::Route'
    DependsOn:
      - NATInstance
      - VPC1PrivateRouteTable
    Properties:
      RouteTableId: !Ref VPC1PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NATInstance

  PrivateSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    DependsOn:
      - VPC1PrivateRouteTable
      - VPC1PrivateSubnet1
    Properties:
      SubnetId: !Ref VPC1PrivateSubnet1
      RouteTableId: !Ref VPC1PrivateRouteTable

  VPC1PrivateNetworkAcl:
    Type: 'AWS::EC2::NetworkAcl'
    DependsOn: VPC1
    Properties:
      VpcId: !Ref VPC1
      Tags:
        - Key: Network
          Value: Private Network ACL
        - Key: Name
          Value: VPC1 Private Network ACL

###########
# VPC2 with 1 public subnet
###########

  VPC2:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: 192.168.0.0/16
      Tags:
        - Key: Name
          Value: VPC2

  VPC2InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    DependsOn: VPC2
    Properties:
      Tags:
        - Key: Name
          Value: VPC2 Internet Gateway

  VPC2AttachInternetGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    DependsOn:
      - VPC2
      - VPC2InternetGateway
    Properties:
      VpcId: !Ref VPC2
      InternetGatewayId: !Ref VPC2InternetGateway

  VPC2PublicSubnet:
    Type: 'AWS::EC2::Subnet'
    DependsOn: VPC2
    Properties:
      VpcId: !Ref VPC2
      CidrBlock: 192.168.1.0/24
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: VPC2 Public Subnet

###########
# VPC2 Routing
###########

  VPC2PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    DependsOn:
      - VPC2
      - VPC2AttachInternetGateway
    Properties:
      VpcId: !Ref VPC2
      Tags:
        - Key: Name
          Value: VPC2 Public Route Table

  VPC2PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn:
      - VPC2
      - VPC2PublicRouteTable
      - VPC2InternetGateway
      - VPC2AttachInternetGateway
    Properties:
      RouteTableId: !Ref VPC2PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VPC2InternetGateway

  VPC2PublicSubnetRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    DependsOn:
      - VPC2PublicRouteTable
      - VPC2PublicSubnet
    Properties:
      SubnetId: !Ref VPC2PublicSubnet
      RouteTableId: !Ref VPC2PublicRouteTable

###########
# Cafe web server instance in VPC1 public subnet
###########

  WebInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - VPC1
      - WebSecurityGroup
      - VPC1PublicSubnet1
    Properties:
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      InstanceType: t3.micro
      IamInstanceProfile: !Ref CafeInstanceProfile
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref VPC1PublicSubnet1
          GroupSet:
            - !Ref WebSecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: Cafe Web Server
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum -y update
          amazon-linux-extras install -y lamp-mariadb10.2-php7.2 php7.2
          yum -y install httpd mariadb-server wget expect
          systemctl enable httpd
          systemctl start httpd
          systemctl enable mariadb
          systemctl start mariadb
          echo '<html><h1>Hello From Your Web Server!</h1></html>' > /var/www/html/index.html
          find /var/www -type d -exec chmod 2775 {} \;
          find /var/www -type f -exec chmod 0664 {} \;
          echo "<?php phpinfo(); ?>" > /var/www/html/phpinfo.php
          usermod -a -G apache ec2-user
          chown -R ec2-user:apache /var/www
          chmod 2775 /var/www
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-1-23732/181-activity-JAWS-troubleshoot-vpc/s3/setup-v2.tar.gz
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-1-23732/181-activity-JAWS-troubleshoot-vpc/s3/db-v2.tar.gz
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-1-23732/181-activity-JAWS-troubleshoot-vpc/s3/cafe-v2.tar.gz
          tar -zxvf setup-v2.tar.gz
          tar -zxvf db-v2.tar.gz
          tar -zxvf cafe-v2.tar.gz -C /var/www/html/
          cd setup-v2
          ./set-app-parameters.sh
          cd ../db-v2/
          ./set-root-password.sh
          ./create-db.sh
          sleep 10
          ACCESS_KEY=${IAMUserAccessKey}
          SECRET_KEY=${IAMUserAccessKey.SecretAccessKey}
          region=$(curl http://169.254.169.254/latest/dynamic/instance-identity/document|grep region | cut -d '"' -f4)
          expect -c "set timeout -1
          spawn aws configure
          expect -re \"AWS Access *\"
          send \"$ACCESS_KEY\r\"
          expect -re \"AWS Secret *\"
          send \"$SECRET_KEY\r\"
          expect -re \"Default region *\"
          send \"$region\r\"
          expect -re \"Default output *\"
          send \"json\r\"
          expect eof"
          sleep 5
          cp -R /root/.aws /home/ec2-user/
          chown -R ec2-user:ec2-user /home/ec2-user/.aws
          routeTableId=$(aws ec2 describe-route-tables --filters "Name=tag:Name,Values='VPC1 Public Route Table'" | grep RouteTableId | sed -n 1p | cut -d '"' -f4)
          aws ec2 delete-route --route-table-id $routeTableId --destination-cidr-block 0.0.0.0/0
          hostnamectl set-hostname web-server

###########
# IAM Permissions for Cafe web server instance
###########

  IamPolicy:
      Type: 'AWS::IAM::Policy'
      Properties:
        PolicyName: FullSsmAccess
        PolicyDocument:
          Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action:
                - 'ssm:*'
              Resource: '*'
        Roles:
          - !Ref CafeIamRole

  CafeIamRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyName: DeleteRouteTableEntry
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - 'ec2:*Route*'
                Resource: '*'

  CafeInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    DependsOn:
      - CafeIamRole
    Properties:
      Path: /
      Roles:
        - !Ref CafeIamRole

###########
# NAT instance in VPC1 public subnet 1
###########

  NATInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - VPC1
      - NATSecurityGroup
      - VPC1PublicSubnet1
    Properties:
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref VPC1PublicSubnet1
          GroupSet:
            - !Ref NATSecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: NAT Instance
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum -y update
          echo 1 > /proc/sys/net/ipv4/ip_forward
          echo 0 > /proc/sys/net/ipv4/conf/eth0/send_redirects
          /sbin/iptables -t nat -A POSTROUTING -o eth0 -s 0.0.0.0/0 -j MASQUERADE
          /sbin/iptables-save > /etc/sysconfig/iptables
          mkdir -p /etc/sysctl.d/
          cat <<EOF > /etc/sysctl.d/nat.conf
          net.ipv4.ip_forward = 1
          net.ipv4.conf.eth0.send_redirects = 0
          EOF

###########
# CLI Host instance in VPC2 public subnet (different VPC on purpose)
###########

  CliHostInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - VPC2
      - CliHostSecurityGroup
      - VPC2PublicSubnet
    Properties:
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref VPC2PublicSubnet
          GroupSet:
            - !Ref CliHostSecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: CLI Host
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum -y update
          hostnamectl set-hostname CLI-HOST

###########
# Instance in VPC1 private subnet
###########

  PrivateInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - VPC1
      - PrivateInstanceSecurityGroup
      - VPC1PrivateSubnet1
    Properties:
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'false'
          SubnetId: !Ref VPC1PrivateSubnet1
          GroupSet:
            - !Ref PrivateInstanceSecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: Private Host
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum -y update

# Do not delete (used by the expect script in UserData)

  IAMUserAccessKey:
    Type: AWS::IAM::AccessKey
    Properties:
      Status: Active
      UserName: awsstudent

###########
# Security Groups
###########

  NATSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DependsOn: VPC1
    Properties:
      GroupDescription: Enable internal access to the NAT device
      VpcId: !Ref VPC1
      Tags:
        - Key: Name
          Value: NATSecurityGroup
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '1024'
          CidrIp: 10.0.3.0/24
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '1024'
          CidrIp: 10.0.4.0/24

  WebSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DependsOn: VPC1
    Properties:
      GroupDescription: Enable HTTP access
      VpcId: !Ref VPC1
      Tags:
        - Key: Name
          Value: WebSecurityGroup
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '80'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0

  CliHostSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DependsOn: VPC2
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPC2
      Tags:
        - Key: Name
          Value: CliHostSecurityGroup
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0

  PrivateInstanceSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DependsOn: VPC1
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPC1
      Tags:
        - Key: Name
          Value: PrivateInstanceSecurityGroup
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0

  IAMUser:
    Type: 'AWS::IAM::User'
    Properties:
      UserName: awsstudent

  IAMPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    DependsOn: IAMUser
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAllActions
            Effect: Allow
            Action:
              - cloudformation:List*
              - cloudformation:Describe*
              - cloudformation:Detect*
              - cloudformation:EstimateTemplateCost
              - cloudformation:Get*
              - cloudwatch:*
              - ec2:*Address*
              - ec2:*associate*
              - ec2:AttachVolume
              - ec2:BundleInstance
              - ec2:Cancel*
              - ec2:*Capacity*
              - ec2:CreateInstanceExportTask
              - ec2:CreateFlowLogs
              - ec2:*Credit*
              - ec2:*Cidr
              - ec2:Delete*
              - ec2:Describe*
              - ec2:DetachVolume
              - ec2:*Dhcp*
              - ec2:*Ebs*
              - ec2:*Event*
              - ec2:*Fleet*
              - ec2:*Format
              - ec2:*Gateway*
              - ec2:Get*
              - ec2:*InstanceAttribute
              - ec2:*InternetGateway
              - ec2:*Image*
              - ec2:*KeyPair
              - ec2:*Kms*
              - ec2:*monitor*
              - ec2:*Network*
              - ec2:*Options
              - ec2:*PrefixList*
              - ec2:ReportInstanceStatus
              - ec2:RebootInstances
              - ec2:ReplaceIamInstanceProfileAssociation
              - ec2:*Route*
              - ec2:*SecurityGroup*
              - ec2:Search*
              - ec2:SendDiagnosticInterrupt
              - ec2:StopInstances
              - ec2:*Snapshot*
              - ec2:*Subnet*
              - ec2:*Tag*
              - ec2:TerminateInstances
              - ec2:*Traffic*
              - ec2:*Vpn*
              - ec2:*Vpc*
              - events:*
              - iam:List*
              - iam:Get*
              - kms:List*
              - kms:Describe*
              - logs:*
              - resource-groups:Get*
              - resource-groups:List*
              - resource-groups:SearchResources
              - s3:*
              - ssm:List*
              - ssm:Describe*
              - ssm:Get*
              - ssm:PutInventory
              - ssm:PutComplianceItems
              - ssm:PutConfigurePackageResult
              - ssm:UpdateAssociationStatus
              - ssm:UpdateInstanceAssociationStatus
              - ssm:UpdateInstanceInformation
              - ssm:CancelCommand
              - ssm:SendCommand
              - ssm:StartAutomationExecution
              - ssm:StartSession
              - ssm:TerminateSession
              - ssm:ResumeSession
              - ssm:DescribeSessions
              - ssm:GetConnectionStatus
              - sns:CreateTopic
              - sns:DeleteTopic
              - sns:AddPermission
              - sns:RemovePermission
              - sns:Publish
              - sns:Subscribe
              - sns:Unsubscribe
              - sns:ConfirmSubscription
              - sns:Get*
              - sns:Set*
              - sns:List*
              - tag:*
            Resource: "*"
          - Sid: RestrictInstanceActions
            Effect: Allow
            Action:
              - ec2:CreateVolume
              - ec2:EnableVolumeIO
              - ec2:ImportVolume
              - ec2:ImportSnapshot
              - ec2:ImportInstance
              - ec2:*LaunchTemplate*
              - ec2:ModifyVolume*
              - ec2:RunInstances
              - ec2:StartInstances
            Resource: "*"
            Condition:
              StringEqualsIfExists:
                ec2:Owner: amazon
              ForAllValues:StringLikeIfExists:
                ec2:InstanceType:
                  - "*.nano"
                  - "*.micro"
                  - "*.small"
                ec2:Tenancy: default
              StringNotEqualsIfExists:
                ec2:PlacementGroupStrategy: cluster
              StringNotEqualsIgnoreCaseIfExists:
                ec2:VolumeType:
                  - io1
                  - st1
              NumericLessThanEqualsIfExists:
                ec2:VolumeSize: '101'
          - Sid: RestrictActions
            Effect: Deny
            Action:
              - ec2:*Spot*
              - ec2:*ReservedInstances*
              - ec2:*Scheduled*
              - ec2:*Purchase*
              - ec2:EnableFastSnapshotRestores
              - ec2:*Fpga*
              - ec2:AcceptVpcEndpointConnections
              - ec2:AttachVpnGateway
              - ec2:CreateCapacityReservation
              - ec2:CreateVpnGateway
              - ec2:EnableFastSnapshotRestores
            Resource: "*"

      ManagedPolicyName: lab_policy
      Users:
        - awsstudent

  IAMUserAccessKey:
    Type: 'AWS::IAM::AccessKey'
    DependsOn: IAMUser
    Properties:
      Status: Active
      UserName: awsstudent

###########
# Read only access for awsstudent (across services)
###########

  ReadOnlyGroup:
      Type: AWS::IAM::Group
      Properties:
        GroupName: QLReadOnly
        ManagedPolicyArns: [ "arn:aws:iam::aws:policy/ReadOnlyAccess" ]

  GroupAssignment:
    Type: AWS::IAM::UserToGroupAddition
    DependsOn: ReadOnlyGroup
    Properties:
      GroupName: QLReadOnly
      Users:
        - awsstudent

Outputs:

  WebServerIP:
    Description: Outputs to be used by activity environment
    Value: !Sub ${WebInstance.PublicIp}

  CliHostIP:
    Description: Outputs to be used by activity environment
    Value: !Sub ${CliHostInstance.PublicIp}

  AccessKey:
    Value: !Ref IAMUserAccessKey

  SecretKey:
    Value: !GetAtt
      - IAMUserAccessKey
      - SecretAccessKey

  VPC1ID:
    Description: Outputs to be used by activity environment
    Value: !Ref VPC1

  VPC1PubSubnetID:
    Description: Outputs to be used by activity environment
    Value: !Ref VPC1PublicSubnet1

  WebServerSgId:
    Description: Outputs to be used by activity environment
    Value: !Ref WebSecurityGroup

  VPC1PubRouteTableId:
    Description: Outputs to be used by activity environment
    Value: !Ref VPC1PublicRouteTable

  VPC1GatewayId:
    Description: Outputs to be used by activity environment
    Value: !Ref VPC1InternetGateway
