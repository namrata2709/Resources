AWSTemplateFormatVersion: "2010-09-09"
Description: "Protect data lab template"
Parameters:

  VPCCIDR:
    Description: CIDR Block for VPC
    Type: String
    Default: 10.0.0.0/16
    AllowedValues:
      - 10.0.0.0/16

  PublicSubnetParam:
    Description:  Public Subnet 1
    Type: String
    Default: 10.0.1.0/24
    AllowedValues:
      - 10.0.1.0/24

  PrivateSubnetParam:
    Description:  Private Subnet
    Type: String
    Default: 10.0.2.0/24

  LinuxAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2

  KeyName:
    Type: String
    Description: Keyname for the keypair that Qwiklab will use to launch EC2 instances
    Default: default-lab-key

  InstanceName:
    Type: String
    Description: Name for the EC2 instance
    Default: File Server


Resources:

#VPC - This will be default VPC for student
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref VPCCIDR
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
        - Key: Name
          Value: LabVPC     

  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    DependsOn: VPC

  AttachGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    DependsOn:
      - VPC
      - InternetGateway
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway  

  PrivateSubnet:
    Type: 'AWS::EC2::Subnet'
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnetParam
      MapPublicIpOnLaunch: True
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Private Subnet

  EC2RouteTable:
    Type: AWS::EC2::RouteTable
    DependsOn: VPC
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: App Route Table

  EC2Route:
    Type: 'AWS::EC2::Route'
    DependsOn:
      - EC2RouteTable
      - AttachGateway
    Properties:
      RouteTableId: !Ref EC2RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  EC2RouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    DependsOn:
      - EC2RouteTable
      - PrivateSubnet
    Properties:
      RouteTableId: !Ref EC2RouteTable
      SubnetId: !Ref PrivateSubnet

  EC2SecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    DependsOn:
      - AttachGateway
    Properties:
      GroupDescription:  security group
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: EC2SecurityGroup     
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '80'
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '443'
          CidrIp: 0.0.0.0/0

         
  EC2Instance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - AttachGateway
      - Ec2InstanceProfile
      - PrivateSubnet
      - EC2SecurityGroup
    Properties:
      IamInstanceProfile: !Ref Ec2InstanceProfile
      ImageId: !Ref LinuxAmiId
      KeyName: !Ref KeyName
      InstanceType: t2.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref PrivateSubnet
          GroupSet:
            - !Ref EC2SecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: !Ref InstanceName

#IAM Portion of LAb
  Ec2InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Path: /
      Roles:
        - !Ref SSMRole
      InstanceProfileName: RoleForSSM

  SSMRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
        # - arn:aws:iam::aws:policy/service-role/AmazonEC2RoleforSSM
      AssumeRolePolicyDocument:
        Statement:
        - Effect: 'Allow'
          Principal:
            Service: ['ec2.amazonaws.com']
          Action: ['sts:AssumeRole']
      Path: '/'

# Type: AWS::KMS::Key
# Properties: 
#   Description: String
#   KeyPolicy: Json
#   KeySpec: String
#   Tags: 
#     - Tag

Outputs:

  Region:
    Value: !Ref AWS::Region

