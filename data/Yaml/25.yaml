AWSTemplateFormatVersion: 2010-09-09
Description: Lambda functions for security demonstration

Resources:
  # Lambda Execution Role
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  # Lambda Role with Custom Policies for Vulnerabilities Demo
  ExampleLambdaRoleForVulnerabilities:
    Type: 'AWS::IAM::Role'
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Policies:
        - PolicyName: LambdaPolicyName
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action: 'logs:CreateLogGroup'
                Resource: !Join 
                  - ''
                  - - 'arn:aws:logs:'
                    - !Ref 'AWS::Region'
                    - ':'
                    - !Ref 'AWS::AccountId'
                    - ':*'
              - Effect: Allow
                Action:
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Join 
                  - ''
                  - - 'arn:aws:logs:'
                    - !Ref 'AWS::Region'
                    - ':'
                    - !Ref 'AWS::AccountId'
                    - ':log-group:/aws/lambda/isolate-ec2-security-group:*'

  # Lambda Functions
  ExampleLambdaFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: get-request
      Runtime: python3.10
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: index.lambda_handler
      Code:
          S3Bucket: 'aws-tc-largeobjects'
          S3Key: 'CUR-TF-100-RSSECY-3-49486/276-lab-SF-Network-Hardening/s3/get-request.zip'      

  ExampleLambdaFunction2:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: generate-password-for-new-account
      Runtime: python3.10
      Role: !GetAtt LambdaExecutionRole.Arn
      Handler: index.lambda_handler
      Code:
          S3Bucket: 'aws-tc-largeobjects'
          S3Key: 'CUR-TF-100-RSSECY-3-49486/276-lab-SF-Network-Hardening/s3/generate-password-for-new-account.zip'