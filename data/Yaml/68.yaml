AWSTemplateFormatVersion: 2010-09-09
Description: CF activity

Parameters:

  KeyName:
    Type: String
    Description: Keyname for the keypair that Vocareum will use
    Default: lab-key-pair

  LatestAmiId:
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: '/aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2'

Resources:

###########
# VPC2 with 1 public subnet
###########

  VPC2:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: 192.168.0.0/16
      Tags:
        - Key: Name
          Value: VPC2

  VPC2InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
    Properties:
      Tags:
        - Key: Name
          Value: VPC2 Internet Gateway

  VPC2AttachInternetGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC2
      InternetGatewayId: !Ref VPC2InternetGateway

  VPC2PublicSubnet:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC2
      CidrBlock: 192.168.1.0/24
      AvailabilityZone: !Select
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: VPC2 Public Subnet

###########
# VPC2 Routing
###########

  VPC2PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC2
      Tags:
        - Key: Name
          Value: VPC2 Public Route Table

  VPC2PublicRoute:
    Type: 'AWS::EC2::Route'
    Properties:
      RouteTableId: !Ref VPC2PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref VPC2InternetGateway

  VPC2PublicSubnetRouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref VPC2PublicSubnet
      RouteTableId: !Ref VPC2PublicRouteTable

###########
# CLI Host instance in VPC2 public subnet
###########

  CliHostInstance:
    Type: 'AWS::EC2::Instance'
    Properties:
      ImageId: !Ref LatestAmiId
      KeyName: !Ref KeyName
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref VPC2PublicSubnet
          GroupSet:
            - !Ref CliHostSecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: CLI Host
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          yum -y update
          yum -y install wget nmap
          hostnamectl set-hostname CLI-HOST
          #wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RESTRT-1/191-activity-JAWS-troubleshoot-cloudformation/s3/template1.yaml
          wget https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/191-activity-JAWS-troubleshoot-cloudformation/s3/template1.yaml
          mv template1.yaml /home/ec2-user/
          chown ec2-user:ec2-user /home/ec2-user/template1.yaml
          ## Did not find template2.yaml
          # wget https://s3-us-west-2.amazonaws.com/aws-tc-largeobjects/CUR-TF-200-RESOPS/template2.yaml
          # mv template2.yaml /home/ec2-user/
          # chown ec2-user:ec2-user /home/ec2-user/template2.yaml

###########
# Security Groups
###########

  CliHostSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable SSH access
      VpcId: !Ref VPC2
      Tags:
        - Key: Name
          Value: CliHostSecurityGroup
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0

###########
# Read only access for awsstudent (across services)
###########

  ReadOnlyGroup:
      Type: AWS::IAM::Group
      Properties:
        GroupName: QLReadOnly
        ManagedPolicyArns: [ "arn:aws:iam::aws:policy/ReadOnlyAccess" ]

  GroupAssignment:
    Type: AWS::IAM::UserToGroupAddition
    DependsOn: ReadOnlyGroup
    Properties:
      GroupName: QLReadOnly
      Users:
        - awsstudent

  IAMUser:
    Type: 'AWS::IAM::User'
    Properties:
      UserName: awsstudent

  IAMPolicy:
    Type: 'AWS::IAM::ManagedPolicy'
    DependsOn: IAMUser
    Properties:
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowAllActions
            Effect: Allow
            Action:
              - 'cloudformation:List*'
              - 'cloudformation:Describe*'
              - 'cloudformation:Detect*'
              - 'cloudformation:EstimateTemplateCost'
              - 'cloudformation:Get*'
              - 'cloudformation:CreateStack'
              - 'cloudformation:DeleteStack'
              - 'cloudformation:UpdateStack'
              - 'cloudwatch:Describe*'
              - 'cloudwatch:Get*'
              - 'cloudwatch:List*'
              - 'ec2:*Address*'
              - 'ec2:*Bundle*'
              - 'ec2:*Cidr*'
              - 'ec2:*Dhcp*'
              - 'ec2:*Encryption*'
              - 'ec2:*Event*'
              - 'ec2:*Gateway*'
              - 'ec2:*IdFormat'
              - 'ec2:*Image*'
              - 'ec2:*KeyPair'
              - 'ec2:*Kms*'
              - 'ec2:*Log*'
              - 'ec2:*Managed*'
              - 'ec2:*Network*'
              - 'ec2:*Route*'
              - 'ec2:*SecurityGroup*'
              - 'ec2:*SnapshotAttribute'
              - 'ec2:*Subnet*'
              - 'ec2:*Tag*'
              - 'ec2:*Task'
              - 'ec2:*Traffic*'
              - 'ec2:*Vpc*'
              - 'ec2:*Vpn*'
              - 'ec2:Accept*'
              - 'ec2:AllocateHosts'
              - 'ec2:Associate*'
              - 'ec2:AttachVolume'
              - 'ec2:Cancel*'
              - 'ec2:Confirm*'
              - 'ec2:CopySnapshot'
              - 'ec2:CreateSnapshot*'
              - 'ec2:Delete*'
              - 'ec2:Describe*'
              - 'ec2:DetachVolume'
              - 'ec2:Disable*'
              - 'ec2:Disassociate*'
              - 'ec2:Export*'
              - 'ec2:Get*'
              - 'ec2:ModifyAvailabilityZoneGroup'
              - 'ec2:ModifyInstanceMetadataOptions'
              - 'ec2:MonitorInstances'
              - 'ec2:ReleaseHosts'
              - 'ec2:ReplaceIamInstanceProfileAssociation'
              - 'ec2:ReportInstanceStatus'
              - 'ec2:SendDiagnosticInterrupt'
              - 'ec2:StopInstances'
              - 'ec2:TerminateInstances'
              - 'ec2:UnmonitorInstances'
              - 'events:*'
              - 'iam:List*'
              - 'iam:Get*'
              - 'kms:List*'
              - 'kms:Describe*'
              - 'logs:*'
              - 'resource-groups:Get*'
              - 'resource-groups:List*'
              - 'resource-groups:SearchResources'
              - 's3:*'
              - 'ssm:List*'
              - 'ssm:Describe*'
              - 'ssm:Get*'
              - 'ssm:PutInventory'
              - 'ssm:PutComplianceItems'
              - 'ssm:PutConfigurePackageResult'
              - 'ssm:UpdateAssociationStatus'
              - 'ssm:UpdateInstanceAssociationStatus'
              - 'ssm:UpdateInstanceInformation'
              - 'ssm:CancelCommand'
              - 'ssm:SendCommand'
              - 'ssm:StartAutomationExecution'
              - 'ssm:StartSession'
              - 'ssm:TerminateSession'
              - 'ssm:ResumeSession'
              - 'sns:CreateTopic'
              - 'sns:DeleteTopic'
              - 'sns:AddPermission'
              - 'sns:RemovePermission'
              - 'sns:Publish'
              - 'sns:Subscribe'
              - 'sns:Unsubscribe'
              - 'sns:ConfirmSubscription'
              - 'sns:Get*'
              - 'sns:Set*'
              - 'sns:List*'
              - 'tag:*'
            Resource: '*'
          - Sid: RestrictInstanceActions
            Effect: Allow
            Action:
              - 'ec2:CreateFleet'
              - 'ec2:CreateLaunchTemplate'
              - 'ec2:CreateLaunchTemplateVersion'
              - 'ec2:CreateVolume'
              - 'ec2:EnableVolumeIO'
              - 'ec2:ImportInstance'
              - 'ec2:ImportSnapshot'
              - 'ec2:ImportVolume'
              - 'ec2:ModifyFleet'
              - 'ec2:ModifyInstanceAttribute'
              - 'ec2:ModifyInstanceCreditSpecification'
              - 'ec2:ModifyLaunchTemplate'
              - 'ec2:ModifyVolume'
              - 'ec2:ModifyVolumeAttribute'
              - 'ec2:RebootInstances'
              - 'ec2:ResetInstanceAttribute'
              - 'ec2:RunInstances'
              - 'ec2:StartInstances'
            Resource: '*'
            Condition:
              StringEqualsIfExists:
                'ec2:Owner': amazon
              StringLikeIfExists:
                'ec2:InstanceType':
                  - t*.nano
                  - t*.micro
                  - t*.small
                'ec2:Tenancy': default
              StringNotEqualsIfExists:
                'ec2:PlacementGroupStrategy': cluster
              StringNotLikeIfExists:
                'ec2:VolumeType':
                  - io*
                  - st*
              NumericLessThanEqualsIfExists:
                'ec2:VolumeSize': '100'
          - Sid: RestrictActions
            Effect: Deny
            Action:
              - 'ec2:*Fpga*'
              - 'ec2:*Purchase*'
              - 'ec2:*ReservedInstances*'
              - 'ec2:*Scheduled*'
              - 'ec2:*Spot*'
              - 'ec2:AcceptVpcEndpointConnections'
              - 'ec2:AttachVpnGateway'
              - 'ec2:CreateCapacityReservation'
              - 'ec2:CreateVpnGateway'
              - 'ec2:EnableFastSnapshotRestores'
              - 's3:*BucketObjectLock*'
              - 's3:*ObjectLegalHold'
              - 's3:*ObjectRetention'
            Resource: '*'
      ManagedPolicyName: lab_policy
      Users:
        - awsstudent

  IAMUserAccessKey:
    Type: 'AWS::IAM::AccessKey'
    DependsOn: IAMUser
    Properties:
      Status: Active
      UserName: awsstudent

  AwsStudentAccessKey:
    Type: AWS::IAM::AccessKey
    DependsOn: IAMUser
    Properties:
      Status: Active
      UserName: awsstudent

Outputs:

  CLIHostIP:
    Description: Outputs to be used by activity environment
    Value: !Sub ${CliHostInstance.PublicIp}

  AccessKey:
    Value: !Ref IAMUserAccessKey

  SecretKey:
    Value: !GetAtt
      - IAMUserAccessKey
      - SecretAccessKey
