      Tags:
        - Key: Name
          Value: web server
        - Key: Environment
          Value: staging
        - Key: Application
          Value: portal
        - Key: Project
          Value: ERPSystem
        - Key: Department
          Value: HR
        - Key: Version
          Value: '1.0'
      InstanceType: !Ref TaggingInstanceType
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'false'
          SubnetId: !Ref PrivateSubnet1
      KeyName: !Ref KeyName
      ImageId: !Ref LinuxAmiId
  Instance4:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - NATInstance
