AWSTemplateFormatVersion: 2010-09-09
Description: Managing Resources with Tagging (Linux)
Parameters:
  VPCCIDR:
    Description: CIDR Block for VPC
    Type: String
    Default: 10.5.0.0/16
    AllowedValues:
      - 10.5.0.0/16
  PublicSubnet1Param:
    Description: Public Subnet 1
    Type: String
    Default: 10.5.0.0/24
    AllowedValues:
      - 10.5.0.0/24
  PrivateSubnet1Param:
    Description: Private Subnet 1
    Type: String
    Default: 10.5.1.0/24
    AllowedValues:
      - 10.5.1.0/24
  KeyName:
    Type: String
    Description: Keyname for the keypair that Vocareum will use to launch EC2 instances
    Default: default-lab-key
    
  TaggingInstanceType:
    Type: String
    Default: t3.micro
  LinuxAmiId:
    Description: The name of the Windows AMI to find based on search
    Type: 'AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>'
    Default: /aws/service/ami-amazon-linux-latest/amzn2-ami-hvm-x86_64-gp2
Resources:
  VPC:
    Type: 'AWS::EC2::VPC'
    Properties:
      CidrBlock: !Ref VPCCIDR
      EnableDnsSupport: 'true'
      EnableDnsHostnames: 'true'
      Tags:
        - Key: VPC
          Value: NAT-and-CLI
        - Key: Name
          Value: Lab VPC
  InternetGateway:
    Type: 'AWS::EC2::InternetGateway'
  AttachGateway:
    Type: 'AWS::EC2::VPCGatewayAttachment'
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway
  PublicSubnet1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Param
      MapPublicIpOnLaunch: 'true'
      AvailabilityZone: !Select 
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Public Subnet 1
  PrivateSubnet1:
    Type: 'AWS::EC2::Subnet'
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Param
      AvailabilityZone: !Select 
        - '0'
        - !GetAZs ''
      Tags:
        - Key: Name
          Value: Private Subnet 1
  PublicRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Public
  PublicRoute:
    Type: 'AWS::EC2::Route'
    DependsOn:
      - AttachGateway
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable
  PrivateRouteTable:
    Type: 'AWS::EC2::RouteTable'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: Private
  PrivateSubnet1RouteTableAssociation:
    Type: 'AWS::EC2::SubnetRouteTableAssociation'
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable
  PrivateNetworkAcl:
    Type: 'AWS::EC2::NetworkAcl'
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Network
          Value: Private
  NATInstance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - AttachGateway
    Properties:
      ImageId: !Ref LinuxAmiId
      KeyName: !Ref KeyName
      InstanceType: t3.micro
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref NATSecurityGroup
      SourceDestCheck: 'false'
      Tags:
        - Key: Name
          Value: NAT
      UserData: !Base64 
        'Fn::Join':
          - |+

          - - '#!/bin/bash'
            - yum -y update
            - echo 1 > /proc/sys/net/ipv4/ip_forward
            - echo 0 > /proc/sys/net/ipv4/conf/eth0/send_redirects
            - >-
              /sbin/iptables -t nat -A POSTROUTING -o eth0 -s 0.0.0.0/0 -j
              MASQUERADE
            - /sbin/iptables-save > /etc/sysconfig/iptables
            - mkdir -p /etc/sysctl.d/
            - cat <<EOF > /etc/sysctl.d/nat.conf
            - net.ipv4.ip_forward = 1
            - net.ipv4.conf.eth0.send_redirects = 0
            - |
              EOF 
  NATSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Enable internal access to the NAT device
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '1024'
          CidrIp: !Ref PrivateSubnet1Param
        - IpProtocol: udp
          FromPort: '0'
          ToPort: '1024'
          CidrIp: !Ref PrivateSubnet1Param
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
  PrivateRoute:
    Type: 'AWS::EC2::Route'
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      InstanceId: !Ref NATInstance
  CLISecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Security Group for CLIEC2Instance
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: CLISecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
  WideOpenSecurityGroup:
    Type: 'AWS::EC2::SecurityGroup'
    Properties:
      GroupDescription: Security Group for instances the students will find and stop in the lab.
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: WideOpenSecurityGroup
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
        - IpProtocol: udp
          FromPort: '0'
          ToPort: '65535'
          CidrIp: 0.0.0.0/0
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: '22'
          ToPort: '22'
          CidrIp: 0.0.0.0/0
  RootRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      Path: /
      Policies:
        - PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Sid: AllowAllActions
                Action:
                  - 'ec2:*Address*'
                  - 'ec2:*Bundle*'
                  - 'ec2:*Cidr*'
                  - 'ec2:*Dhcp*'
                  - 'ec2:*Encryption*'
                  - 'ec2:*Event*'
                  - 'ec2:*Gateway*'
                  - 'ec2:*IdFormat'
                  - 'ec2:*Image*'
                  - 'ec2:*KeyPair'
                  - 'ec2:*Kms*'
                  - 'ec2:*Log*'
                  - 'ec2:*Managed*'
                  - 'ec2:*Network*'
                  - 'ec2:*Route*'
                  - 'ec2:*SecurityGroup*'
                  - 'ec2:*SnapshotAttribute'
                  - 'ec2:*Subnet*'
                  - 'ec2:*Tag*'
                  - 'ec2:*Task'
                  - 'ec2:*Traffic*'
                  - 'ec2:*Vpc*'
                  - 'ec2:*Vpn*'
                  - 'ec2:Accept*'
                  - 'ec2:AllocateHosts'
                  - 'ec2:Associate*'
                  - 'ec2:AttachVolume'
                  - 'ec2:Cancel*'
                  - 'ec2:Confirm*'
                  - 'ec2:CopySnapshot'
                  - 'ec2:CreateSnapshot*'
                  - 'ec2:Delete*'
                  - 'ec2:Describe*'
                  - 'ec2:DetachVolume'
                  - 'ec2:Disable*'
                  - 'ec2:Disassociate*'
                  - 'ec2:Export*'
                  - 'ec2:Get*'
                  - 'ec2:ModifyAvailabilityZoneGroup'
                  - 'ec2:ModifyInstanceMetadataOptions'
                  - 'ec2:MonitorInstances'
                  - 'ec2:ReleaseHosts'
                  - 'ec2:ReplaceIamInstanceProfileAssociation'
                  - 'ec2:ReportInstanceStatus'
                  - 'ec2:SendDiagnosticInterrupt'
                  - 'ec2:StopInstances'
                  - 'ec2:TerminateInstances'
                  - 'ec2:UnmonitorInstances'
                  - 'iam:List*'
                  - 'iam:Get*'
                  - 'tags:*'
                  - 'ssm:*'
                  - 'cloudformation:List*'
                  - 'cloudformation:Get*'
                  - 'cloudformation:Describe*'
                  - 'cloudformation:Detect*'
                  - 'cloudwatch:Describe*'
                  - 'cloudwatch:Get*'
                  - 'cloudwatch:List*'
                  - 'logs:List*'
                  - 'logs:Describe*'
                  - 'logs:Get*'
                  - 'logs:StartQuery'
                  - 'logs:StopQuery'
                  - 'logs:TestMetricFilter'
                  - 'logs:FilterLogEvents'
                  - 'events:Describe*'
                  - 'events:List*'
                  - 'events:TestEventPattern'
                  - 'resource-groups:Get*'
                  - 'resource-groups:List*'
                  - 'resource-groups:SearchResources'
                  - 'sns:ListTopics'
                Effect: Allow
                Resource: '*'
              - Sid: RestrictInstanceActions
                Effect: Allow
                Action:
                  - 'ec2:CreateVolume'
                  - 'ec2:StartInstances'
                Resource: '*'
                Condition:
                  StringEqualsIfExists:
                    'ec2:Owner': amazon
                  StringLikeIfExists:
                    'ec2:InstanceType':
                      - t*.nano
                      - t*.micro
                      - t*.small
                    'ec2:Tenancy': default
                  StringNotEqualsIfExists:
                    'ec2:PlacementGroupStrategy': cluster
                  StringNotLikeIfExists:
                    'ec2:VolumeType':
                      - io*
                      - st*
                  NumericLessThanEqualsIfExists:
                    'ec2:VolumeSize': '35'
              - Sid: RestrictActions
                Effect: Deny
                Action:
                  - 'ec2:*Fpga*'
                  - 'ec2:*Purchase*'
                  - 'ec2:*ReservedInstances*'
                  - 'ec2:*Scheduled*'
                  - 'ec2:*Spot*'
                  - 'ec2:AcceptVpcEndpointConnections'
                  - 'ec2:AttachVpnGateway'
                  - 'ec2:CreateCapacityReservation'
                  - 'ec2:CreateVpnGateway'
                  - 'ec2:EnableFastSnapshotRestores'
                Resource: '*'
          PolicyName: mypolicy
  RootInstanceProfile:
    Type: 'AWS::IAM::InstanceProfile'
    Properties:
      Path: /
      Roles:
        - !Ref RootRole
  CLIEC2Instance:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - AttachGateway
      - PublicSubnet1RouteTableAssociation
    Properties:
      KeyName: !Ref KeyName
      IamInstanceProfile: !Ref RootInstanceProfile
      ImageId: !Ref LinuxAmiId
      DisableApiTermination: 'false'
      InstanceType: t3.medium
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'true'
          SubnetId: !Ref PublicSubnet1
          GroupSet:
            - !Ref CLISecurityGroup
      Tags:
        - Key: Name
          Value: Command Host
      UserData: !Base64 
        'Fn::Join':
          - ''
          - - |
              #!/bin/bash -ex
            - |
              yum -y update 
            - |
              mkdir /home/ec2-user/.aws 
            - |
              cat > /home/ec2-user/.aws/config <<EOF
            - |
              [default]
            - 'region = '
            - !Ref 'AWS::Region'
            - |+

            - |
              EOF
            - |
              chown -R ec2-user:ec2-user /home/ec2-user/.aws
            - |
              cd /home/ec2-user
            - |
              yum -y install php
            - >
              wget
              https://aws-tc-largeobjects.s3.us-west-2.amazonaws.com/CUR-TF-100-RSJAWS-3-124627/188-lab-JAWS-resources-tagging/s3/aws-tools.zip
            - |
              unzip /home/ec2-user/aws-tools.zip
            - |
              chown -R ec2-user:ec2-user /home/ec2-user/aws-tools
            - |
              chown -R ec2-user:ec2-user /home/ec2-user/aws-tools.zip
            - |
              chmod 740 /home/ec2-user/aws-tools/stopinator.php
            - |
              chmod 740 /home/ec2-user/aws-tools/terminate-instances.php
            - >
              mv /home/ec2-user/aws-tools/change-resource-tags
              /home/ec2-user/change-resource-tags.sh
            - |
              chmod 740 change-resource-tags.sh
            - |
              chown -R ec2-user:ec2-user change-resource-tags.sh
            - '/opt/aws/bin/cfn-signal -e $? '
            - '         --stack '
            - !Ref 'AWS::StackName'
            - '         --resource CLIEC2Instance '
            - '         --region '
            - !Ref 'AWS::Region'
            - |+

    CreationPolicy:
      ResourceSignal:
        Count: '1'
        Timeout: PT15M
  Instance1:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - NATInstance
      - AttachGateway
    Properties:
      Tags:
        - Key: Name
          Value: web server
        - Key: Environment
          Value: development
        - Key: Application
          Value: portal
        - Key: Project
          Value: ERPSystem
        - Key: Department
          Value: HR
        - Key: Version
          Value: '1.0'
      InstanceType: !Ref TaggingInstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'false'
          SubnetId: !Ref PrivateSubnet1
      ImageId: !Ref LinuxAmiId
  Instance2:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - NATInstance
      - AttachGateway
    Properties:
      Tags:
        - Key: Name
          Value: app server
        - Key: Environment
          Value: development
        - Key: Application
          Value: portal
        - Key: Project
          Value: ERPSystem
        - Key: Department
          Value: HR
        - Key: Version
          Value: '1.0'
      InstanceType: !Ref TaggingInstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'false'
          SubnetId: !Ref PrivateSubnet1
          GroupSet:
            - !Ref WideOpenSecurityGroup
      ImageId: !Ref LinuxAmiId
  Instance3:
    Type: 'AWS::EC2::Instance'
    DependsOn:
      - NATInstance
      - AttachGateway
