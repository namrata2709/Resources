        - Key: Application
          Value: portal
        - Key: Project
          Value: ERPSystem
        - Key: Department
          Value: HR
        - Key: Version
          Value: '1.0'
      InstanceType: !Ref TaggingInstanceType
      KeyName: !Ref KeyName
      NetworkInterfaces:
        - DeviceIndex: '0'
          AssociatePublicIpAddress: 'false'
          SubnetId: !Ref PrivateSubnet1
      ImageId: !Ref LinuxAmiId
