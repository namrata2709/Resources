<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hands-on Labs - AWS Learning Dashboard</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <button id="themeToggle" class="theme-toggle">
        <span class="theme-icon"></span>
    </button>

    <div class="page-container">
        <header class="page-header">
            <button class="back-btn" onclick="location.href='index.html'">← Back</button>
            <h1>🔬 Hands-on Labs</h1>
        </header>

        <div class="search-bar">
            <input type="text" id="searchInput" placeholder="🔍 Search labs..." oninput="filterLabs()">
        </div>

        <!-- Filter and Sort Controls -->
        <div class="filter-controls">
            <div class="filter-group">
                <label for="categoryFilter">Filter by Category:</label>
                <select id="categoryFilter" onchange="filterLabs()">
                    <option value="">All Categories</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="difficultyFilter">Filter by Difficulty:</label>
                <select id="difficultyFilter" onchange="filterLabs()">
                    <option value="">All Levels</option>
                    <option value="beginner">Beginner</option>
                    <option value="intermediate">Intermediate</option>
                    <option value="advanced">Advanced</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sortSelect">Sort by:</label>
                <select id="sortSelect" onchange="sortLabs()">
                    <option value="order-asc">Lab Order</option>
                    <option value="title-asc">Title (A-Z)</option>
                    <option value="title-desc">Title (Z-A)</option>
                    <option value="category-asc">Category (A-Z)</option>
                </select>
            </div>
        </div>

        <!-- Labs Grid with Folders -->
        <div id="labsContainer" class="notes-grid">
            <div class="loading">Loading labs...</div>
        </div>
    </div>

    <!-- Modal for showing lab contents -->
    <div id="labModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modalTitle"></h2>
                <button class="modal-close" onclick="closeModal()">✕</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <!-- External JS -->
    <script src="js/theme.js"></script>
    <script src="js/labs.js"></script>
</body>
</html>
